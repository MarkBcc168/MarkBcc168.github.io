  starred: false
  subject: E
  statement: |-
    Let \(ABC\) be a triangle. The following diagram contains points \(P_1,P_2,\dots,P_7\), which are the following triangle centers of triangle \(ABC\) in some order:

    <ul>
    <li> the incenter \(I\); </li>
    <li> the circumcenter \(O\); </li>
    <li> the orthocenter \(H\); </li>
    <li> the symmedian point \(L\), which is the intersections of the reflections of \(B\)-median and \(C\)-median across angle bisectors of \(\angle ABC\) and \(\angle ACB\), respectively; </li>
    <li> the Gergonne point \(G\), which is the intersection of lines from \(B\) and \(C\) to the tangency points of the incircle with \(\overline{AC}\) and \(\overline{AB}\), respectively; </li>
    <li> the Nagel point \(N\), which is the intersection of line from \(B\) to the tangency point between \(B\)-excircle and \(\overline{AC}\), and line from \(C\) to the tangency point between \(C\)-excircle and \(\overline{AB}\); and </li>
    <li> the Kosnita point \(K\), which is the intersection of lines from \(B\) and \(C\) to the circumcenters of triangles \(AOC\) and \(AOB\), respectively. </li>
    </ul>

    <div style="display: flex; justify-content: center;">
    <img src="static/hmmt/kimberling.svg"></img>
    </div>

    <p>Note that the triangle \(ABC\) is not shown.
    Compute which triangle centers \(\{I,O,H,L,G,N,K\}\) corresponds to \(P_k\) for \(k\in\{1,2,3,4,5,6,7\}\).</p>



    <p>Your answer should be a seven-character string containing \(I\), \(O\), \(H\), \(L\), \(G\), \(N\), \(K\), or \(X\) for blank. For instance, if you think \(P_2=H\) and \(P_6=L\), you would answer \(XHXXXLX\). If you attempt to identify \(n>0\) points and get them <b>all</b> correct, then you will receive \(\left\lceil (n-1)^{5/3}\right\rceil\) points. Otherwise, you will receive \(0\) points.</p>

