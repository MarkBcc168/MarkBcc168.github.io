    <p>Submit a positive integer \(A.\) If the correct answer is \(C\) and your answer is \(A\), you will receive \(\left\lfloor 20\left(\min\left(\frac{A}{C}, \frac{C}{A}\right)\right)^2\right\rfloor\) points.</p>

