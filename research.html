<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en" xml:lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf8" />
    <title>Pitchayut - Research</title>
    <meta name="description" content="Pitchayut Saengrungkongka's research papers" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel='stylesheet' href='https://fonts.googleapis.com/css?family=Noto Sans'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="/styles.css">
    <script id="MathJax-script" async="" src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="/macros.js"></script>
    <script type="module">
    import { load } from "https://cdn.jsdelivr.net/npm/js-yaml@5.4.3/+esm";

    async function load_research(){
        const response = await fetch("./inputs/research.yaml");

        if (!response.ok) {
          throw new Error(`Failed to load research.yaml: ${response.status}`);
        }

        const papers = load(await response.text(), {filename: "research.yaml"});

        const papers_div = document.getElementById("papers");
        let n = papers.length;

        for(const paper of papers){
          const detail_element = document.createElement("details");
          detail_element.classList.add("paper-header");
          const summary = document.createElement("summary");
          //title
          const paper_header = document.createElement("div");
          paper_header.classList.add("paper-header");
          const paper_title = document.createElement("div");
          paper_title.classList.add("paper-title");
          paper_title.innerHTML = `${n}. ${paper.title}`;
          paper_header.append(paper_title);
          //coauthors
          const coauthors = paper.coauthors ?? [];
          if(coauthors.length > 0){
            paper_header.insertAdjacentHTML("beforeend", `(with ${coauthors.join(", ")})`);
          }
          summary.append(paper_header);
          //first link
          const paper_link = document.createElement("div");
          paper_link.classList.add("paper-link");
          const firstLink = Object.entries(paper.links ?? {})[0];
          paper_link.innerHTML = `(<a href=${firstLink[1]}>${firstLink[0]}</a>)`
          summary.append(paper_link);
          //journal 
          const content = document.createElement("div");
          content.classList.add("details-content");
          const journal = paper.journal ?? "";
          if(journal != ""){
            content.innerHTML += `<p>${journal}</p>`;
          }
          const notes = paper.notes ?? "";
          if(notes != ""){
            content.innerHTML += `<p>${notes}</p>`;
          }
          const abstract = paper.abstract ?? "";
          if(abstract != ""){
            content.innerHTML += `<p><b>Abstract.</b><br>${abstract}</p>`;
          }
          const links = Object.entries(paper.links ?? {});
          content.innerHTML += "<p>";
          for(const link of links){
            content.innerHTML += `(<a href=${link[1]}>${link[0]}</a>) `;
          }
          content.innerHTML += "</p>";

    
          detail_element.append(summary);
          detail_element.append(content);
          papers_div.append(detail_element);
          n -= 1;
        }
      setup_content();
      await MathJax.typesetPromise();
    }
    document.addEventListener('DOMContentLoaded', load_research);
    </script>
  </head>
  <body>
    <div class="box">
     
    <div class="header">
        <h1 id="no-hash">Pitchayut Saengrungkongka</h1>
    </div>
    <div class="menu">
        <a href="/index.html">Home</a>
        <a href="/research.html">Research</a>
        <div class="dropdown">
          <button class="dropbtn">Problems</button>
          <div class="dropdown-content">
            <a href="/olympiad.html">Olympiad</a>
            <a href="/hmmt.html">HMMT</a>
          </div>
        </div>
        <a href="/notes.html">Notes</a>
    </div>


      <div class="content">
        <h1>Research</h1>
        <p>Here is a list of my papers and preprints. 
          Click on each title to view the abstract.
        </p>
        <p><button onclick="expand_all(true)">Expand all</button>
          <button onclick="expand_all(false)">Collapse all</button>
        </p>
        <div id="papers">

        </div>
      </div>
    </div>

    <div class="footer">
        Pitchayut Saengrungkongka
